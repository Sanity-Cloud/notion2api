name: Hive ChatGPT review adapter

on:
  pull_request:
    paths:
      - "app/hive_*.py"
      - "tests/test_hive_*.py"
      - "tests/test_file_discovery_routing.py"
      - ".github/workflows/hive-chatgpt-review.yml"
  push:
    branches:
      - "feature/hive-compiled-aigentai-chatgpt-review-20261113"

permissions:
  contents: read

jobs:
  read-only-hive-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies and test tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pylint ruff
      - name: Credential-free source and recovery tests
        run: |
          python -m pytest -q tests/test_hive_dispatcher.py tests/test_hive_agent_memory_loadout.py tests/test_hive_external_effects.py tests/test_hive_chatgpt_review.py tests/test_file_discovery_routing.py
      - name: Error-only Pylint
        run: python -m pylint -E app/hive_dispatcher.py app/hive_chatgpt_review.py tests/test_hive_chatgpt_review.py tests/test_hive_dispatcher.py
      - name: Ruff
        run: python -m ruff check app/hive_dispatcher.py app/hive_chatgpt_review.py tests/test_hive_chatgpt_review.py tests/test_hive_dispatcher.py
