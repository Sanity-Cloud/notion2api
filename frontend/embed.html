<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notion2API Assistant</title>
  <style>
    :root{color-scheme:light dark;--bg:#fff;--surface:#f7f7f5;--text:#202020;--muted:#727272;--border:#dededb;--accent:#202020;--on-accent:#fff}*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px/1.45 ui-sans-serif,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#191919;--surface:#242424;--text:#f1f1ef;--muted:#a7a7a3;--border:#3b3b3b;--accent:#f1f1ef;--on-accent:#191919}.shell{height:100%;display:grid;grid-template-rows:auto 1fr auto}.header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.header h1{font-size:14px;margin:0}.status{font-size:11px;color:var(--muted)}.messages{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.empty{margin:auto;text-align:center;color:var(--muted);max-width:260px}.message{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;border-radius:10px;background:var(--surface)}.message.user{align-self:flex-end;background:var(--accent);color:var(--on-accent)}.message.assistant{align-self:flex-start}.composer{border-top:1px solid var(--border);padding:10px}.attachments{font-size:11px;color:var(--muted);padding:0 4px 7px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:end}.row textarea{min-height:40px;max-height:120px;resize:none;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:9px 10px;font:inherit}.button{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);min-width:40px;height:40px;padding:0 10px}.send{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.button:disabled{opacity:.5}.file{display:none}
  </style>
</head>
<body>
  <div class="shell">
    <header class="header"><h1 id="title">Research Assistant</h1><span id="status" class="status" role="status">Ready</span></header>
    <main id="messages" class="messages"><div id="empty" class="empty">Ask a question through your private Notion2API service.</div></main>
    <footer class="composer">
      <div id="attachments" class="attachments"></div>
      <div class="row">
        <button id="attach" class="button" type="button" aria-label="Attach files">＋</button>
        <input id="file" class="file" type="file" multiple>
        <textarea id="input" rows="1" aria-label="Message" placeholder="Send a message…"></textarea>
        <button id="send" class="button send" type="button">Send</button>
      </div>
    </footer>
  </div>
  <script>
    const params=new URLSearchParams(location.search),title=params.get('title')||'Research Assistant',model=params.get('model')||'terra';
    const dark=params.get('theme')==='dark'||(params.get('theme')!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);if(dark)document.body.classList.add('dark');document.getElementById('title').textContent=title;
    const messages=[],pending=[];let conversationId='',controller=null;
    const $=id=>document.getElementById(id),status=$('status'),input=$('input'),send=$('send'),file=$('file'),attachments=$('attachments');
    function add(role,text){$('empty')?.remove();const el=document.createElement('div');el.className=`message ${role}`;el.textContent=text;$('messages').append(el);$('messages').scrollTop=$('messages').scrollHeight;return el}
    function renderFiles(){attachments.textContent=pending.length?pending.map(item=>item.name).join(', '):''}
    function readFile(item){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:item.name,content_type:item.type||'application/octet-stream',data:reader.result});reader.onerror=()=>reject(reader.error);reader.readAsDataURL(item)})}
    function terminalError(reason,code='stream_terminal_error'){const error=new Error(reason);error.errorCode=code;return error}
    function createTerminalState(){return{finishReason:null,finishCount:0,done:false,failure:null}}
    function consume(payload,target,state){
      if(!payload||state.done||state.failure)return;
      if(payload==='[DONE]'){state.done=true;return}
      let data;try{data=JSON.parse(payload)}catch{return}
      if(!data||typeof data!=='object'||Array.isArray(data))return;
      const structured=data.error;
      if(data.object==='error'||data.type==='stream_error'||structured){state.failure={code:structured?.code||data.code||'stream_error',message:structured?.message||data.message||'The stream reported an error.'};return}
      const choice=Array.isArray(data.choices)&&data.choices[0]&&typeof data.choices[0]==='object'?data.choices[0]:null;
      const finish=choice?.finish_reason;
      if(finish!==undefined&&finish!==null){
        const normalized=String(finish);
        if(normalized==='error'||normalized==='content_filter'){state.failure={code:normalized,message:`The stream ended with finish_reason=${normalized}.`};return}
        if(!['stop','length','tool_calls','function_call'].includes(normalized)){state.failure={code:'unrecognized_finish_reason',message:`Unsupported finish_reason=${normalized}.`};return}
        state.finishCount+=1;state.finishReason=normalized;
        if(state.finishCount!==1){state.failure={code:'multiple_finish_reasons',message:'The stream emitted more than one successful finish reason.'};return}
      }
      if(data.type==='content_replace'){target.textContent=String(data.content||'');return}
      const chunk=choice?.delta?.content||'';if(chunk)target.textContent+=chunk;
    }
    async function submit(){
      const text=input.value.trim();if((!text&&!pending.length)||controller){if(controller)controller.abort();return}
      const apiKey=localStorage.getItem('claude_api_key')||'';if(!apiKey){status.textContent='Open the main UI and save its API key first.';return}
      input.value='';const outgoing=text||'Please analyze the attached files.';messages.push({role:'user',content:outgoing});add('user',outgoing);const target=add('assistant','');send.textContent='Stop';controller=new AbortController();status.textContent='Working?';const terminal=createTerminalState();
      try{
        const files=await Promise.all(pending.splice(0).map(readFile));renderFiles();
        const response=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`,'X-Client-Type':'web'},signal:controller.signal,body:JSON.stringify({model,messages,conversation_id:conversationId||null,stream:true,attachments:files,metadata:{persist_remote_chat:true}})});
        conversationId=response.headers.get('X-Conversation-Id')||conversationId;
        if(!response.ok){const error=await response.json().catch(()=>({}));throw new Error(error?.error?.message||`Request failed (${response.status})`)}
        const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';
        while(!terminal.done&&!terminal.failure){
          const{done,value}=await reader.read();if(done)break;
          buffer+=decoder.decode(value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop()||'';
          for(const event of events){if(terminal.done||terminal.failure)break;for(const line of event.split('\n').filter(line=>line.startsWith('data:'))){consume(line.slice(5).trim(),target,terminal);if(terminal.done||terminal.failure)break}}
        }
        if(!terminal.done&&!terminal.failure&&buffer.trim().startsWith('data:'))consume(buffer.trim().slice(5).trim(),target,terminal);
        if(terminal.failure)throw terminalError(terminal.failure.message,terminal.failure.code);
        if(!terminal.done||terminal.finishCount!==1||!['stop','length','tool_calls','function_call'].includes(terminal.finishReason))throw terminalError('The stream ended before a valid finish reason and [DONE] receipt.','incomplete_terminal_state');
        if(target.textContent.trim())messages.push({role:'assistant',content:target.textContent});else target.textContent='No visible response received.';
        status.textContent='Ready';
      }catch(error){target.textContent=error.name==='AbortError'?'Cancelled.':error.message;status.textContent=error.name==='AbortError'?'Cancelled':'Failed'}
      finally{controller=null;send.textContent='Send'}
    }
    $('attach').onclick=()=>file.click();file.onchange=()=>{pending.push(...file.files);file.value='';renderFiles()};send.onclick=submit;input.onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submit()}};
  </script>
</body>
</html>
